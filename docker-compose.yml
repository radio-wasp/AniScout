services:
  aniscout:
    build: .
    container_name: aniscout
    restart: unless-stopped
    ports:
      - "${PORT:-3456}:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # Primary request mode: "seerr", "arr" (direct Sonarr/Radarr), or "both"
      - DEFAULT_MODE=${DEFAULT_MODE:-seerr}
      # Seerr (Overseerr / Jellyseerr) Configuration
      - SEERR_URL=${SEERR_URL:-}
      - SEERR_API_KEY=${SEERR_API_KEY:-}
      # Sonarr Configuration (for TV / OVA / ONA / Short anime)
      - SONARR_URL=${SONARR_URL:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - SONARR_QUALITY_PROFILE_ID=${SONARR_QUALITY_PROFILE_ID:-}
      - SONARR_ROOT_FOLDER=${SONARR_ROOT_FOLDER:-}
      - SONARR_LANGUAGE_PROFILE_ID=${SONARR_LANGUAGE_PROFILE_ID:-1}
      - SONARR_ANIME_SERIES_TYPE=${SONARR_ANIME_SERIES_TYPE:-anime}
      - SONARR_SEARCH_ON_ADD=${SONARR_SEARCH_ON_ADD:-true}
      # Radarr Configuration (for Anime Movies)
      - RADARR_URL=${RADARR_URL:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - RADARR_QUALITY_PROFILE_ID=${RADARR_QUALITY_PROFILE_ID:-}
      - RADARR_ROOT_FOLDER=${RADARR_ROOT_FOLDER:-}
      - RADARR_SEARCH_ON_ADD=${RADARR_SEARCH_ON_ADD:-true}
    volumes:
      - ./data:/data
      - ./src:/app/src
      - ./public:/app/public
      - ./server.js:/app/server.js
